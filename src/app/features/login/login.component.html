<div class="flex flex-col min-h-screen">
  <app-header></app-header>

  <div class="w-full flex flex-1">
    <div class="w-[290px] border-r bg-white">
      <div class="px-3 py-3 space-y-4">
        <div class="flex items-center gap-3 bg-gradient-to-r from-[#0a3a7a] to-[#062b5c] text-white px-8 py-[8px] rounded-full text-[20px] font-semibold w-[200px]">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3" />
          </svg>
          <span>Sign In</span>
        </div>

        <div class="flex items-start gap-3 w-full">
          <div class="space-y-[3px]">
            <span class="block w-5 h-[2px] bg-black"></span>
            <span class="block w-5 h-[2px] bg-black"></span>
            <span class="block w-3 h-[2px] bg-black"></span>
          </div>
          <div class="flex-1 border-t border-dashed border-gray-400"></div>
        </div>
      </div>
    </div>

    <div class="w-full flex flex-col bg-white">
      
      <div class="w-full bg-white">
        <div class="max-w-[1952px] mx-auto px-4 py-3 flex items-center">
          <div class="relative z-10 flex items-center">
            <span class="bg-[#d9d9d9] text-[#222] px-6 py-[8px] text-[14px] font-medium inline-block shadow-sm">
              Notice
            </span>
            <span class="w-0 h-0 border-t-[22px] border-t-transparent border-b-[22px] border-b-transparent border-l-[18px] border-l-[#d9d9d9]"></span>
          </div>
          <div class="h-[24px] w-[85%] bg-white shadow-[0_3px_6px_rgba(0,0,0,0.20)] rounded-sm"></div>
        </div>
      </div>

      <div class="w-full flex-1 flex items-start justify-center bg-white pt-16">
        <div style="width: 790px; background: white; padding: 12px; border: 1px solid #c8d3e2; 
                    box-shadow: 0px 10px 40px 10px rgba(10, 58, 122, 0.12); border-radius: 2px;">
          
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="h-full">
            <fieldset style="border: 1.5px solid #888; padding: 30px 45px; height: 100%; background: white;">
              <legend style="width: auto; padding: 0 12px; font-weight: bold; font-size: 18px; color: #333; margin-left: 15px;">
                Sign In
              </legend>

              <div class="space-y-5">
                <div>
                  <label class="block text-[14px] font-bold mb-1 text-[#333]">User Name *</label>
                  <input 
                    type="text" 
                    formControlName="username" 
                    placeholder="type your user name" 
                    class="w-full h-[36px] border border-[#bbb] px-3 bg-[#f0f4f9] focus:outline-none focus:border-black" 
                    style="font-size: 14px;"
                  />
                  <div class="text-red-600 text-[13px] mt-1" *ngIf="submitted && !loginForm.get('username')?.value">
                    Please type your user name
                  </div>
                  <div class="text-red-600 text-[13px] mt-1" *ngIf="(loginForm.get('username')?.value || '').length > 12">
                    User Name must be exactly 12 characters
                  </div>
                </div>

                <div>
                  <label class="block text-[14px] font-bold mb-1 text-[#333]">Password *</label>
                  <input 
                    type="password" 
                    formControlName="password" 
                    placeholder="type your password" 
                    class="w-full h-[36px] border border-[#bbb] px-3 bg-[#f0f4f9] focus:outline-none focus:border-black" 
                    style="font-size: 14px;"
                  />
                  <div class="text-red-600 text-[13px] mt-1" *ngIf="submitted && !loginForm.get('password')?.value">
                    Please type your password
                  </div>
                  <div class="text-red-600 text-[13px] mt-1" *ngIf="(loginForm.get('password')?.value || '').length > 6">
                    Password must be exactly 6 characters
                  </div>
                </div>

                <div class="text-center text-red-600 font-semibold text-[14px]" *ngIf="errorMessage">
                  {{ errorMessage }}
                </div>

                <div class="text-center pt-2">
                  <button type="submit" style="background: #0a3a7a; color: #fff; padding: 10px 50px; border: none; font-weight: bold; font-size: 15px; border-radius: 2px; cursor: pointer;">
                    Sign In
                  </button>
                </div>
              </div>
            </fieldset>
          </form>
        </div>
      </div>
    </div>
  </div>

  <app-footer></app-footer>
</div>
