<div class="w-full flex justify-start bg-white py-1">
  <div class="w-full max-w-[1477px] h-auto">

    <!-- NOTICE -->
    <div class="w-full bg-white px-1 py-2 flex items-center">
      <div class="flex items-center">
        <span class="bg-[#d9d9d9] text-[#222] px-4 py-1 text-[16px] font-medium">
          Notice
        </span>
        <span class="w-0 h-0 border-t-[16px] border-t-transparent border-b-[16px] border-b-transparent border-l-[14px] border-l-[#d9d9d9]"></span>
      </div>
    </div>

    <!-- Page Title -->
    <div class="bg-[#e5e5e5] px-6 py-3 rounded-t shadow">
      <h1 class="text-3xl font-medium text-gray-800">Signature Sheet</h1>
    </div>

    <!-- Form Card -->
    <div class="bg-white shadow-lg border border-gray-200 rounded-b p-4 md:p-6">
  
  <div class="p-3 md:p-8 rounded-lg" 
       style="background-image: 
       url(&quot;data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='8' ry='8' stroke='%23333' stroke-width='1.5' stroke-dasharray='3%2c 4' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e&quot;);">
      

        <!-- Job Position -->
        <div class="mb-3">
          <label class="block font-semibold mb-1">
            Job Position <span class="text-red-600">*</span>
          </label>
          <select [(ngModel)]="selectedJob" (change)="onJobChange()" class="w-full md:w-[420px] h-11 border rounded px-3">
            <option value="">Select</option>
            <option *ngFor="let job of jobs" [value]="job.id">{{ job.name }}</option>
          </select>
          <div *ngIf="showJobError" class="text-red-600 text-sm mt-1">
            Please Select Job Position.
          </div>
        </div>

        <div style="height: 1.5px; width: 100%; margin: 20px 0; display: block !important; background-image: url(&quot;data:image/svg+xml,%3csvg width='100%25' height='1.5px' xmlns='http://www.w3.org/2000/svg'%3e%3cline x1='0' y1='0.75' x2='100%25' y2='0.75' stroke='%23333' stroke-width='1.5' stroke-dasharray='3%2c 4'/%3e%3c/svg%3e&quot;);"></div>

        <!-- Center & Room -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

          <!-- Center -->
          <div>
            <label class="block font-semibold mb-1">
              Center <span class="text-red-600">*</span>
            </label>
            <select [(ngModel)]="selectedCenter" (change)="onCenterChange()" class="w-full h-10 border rounded px-3">
              <option value="">Select</option>
              <option *ngFor="let center of filteredCenters" [value]="center.id">{{ center.name }}</option>
            </select>
            <div *ngIf="showCenterError" class="text-red-600 text-sm mt-1">
              Center Name should be selected.
            </div>
          </div>

          <!-- Room -->
          <div>
            <label class="block font-semibold mb-1">
              Room <span class="text-red-600">*</span>
            </label>
            <select [(ngModel)]="selectedRoom" class="w-full h-10 border rounded px-3">
              <option value="">Select</option>
              <option *ngFor="let room of filteredRooms" [value]="room.id">{{ room.name }}</option>
            </select>
            <div *ngIf="showRoomError" class="text-red-600 text-sm mt-1">
              Room Location should be selected
            </div>
          </div>

        </div>

        <!-- Button -->
        <div class="text-center mt-4">
          <button (click)="startPdf()" class="bg-[#0b2d6b] hover:bg-[#081f4a] text-white font-semibold px-6 py-2 rounded shadow">
            Start Pdf
          </button>
        </div>

      </div>
    </div>

  </div>
</div>
